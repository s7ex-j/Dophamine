name: Deploy web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      ASSETS_TOKEN: ${{ secrets.DOPHAMINE_ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Contenido privado (RepDB y arte de Term) desde s7ex-j/dophamine-assets. Sin el secreto
      # (forks, PR de terceros) se salta y la app compila con los módulos vacíos.
      - name: Contenido privado
        if: env.ASSETS_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/s7ex-j/dophamine-assets.git" "$RUNNER_TEMP/privado"
          cp -r "$RUNNER_TEMP/privado/assets" "$RUNNER_TEMP/privado/src" .
          rm -rf "$RUNNER_TEMP/privado"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # App de Expo, servida en /Dophamine/app/ (experiments.baseUrl en app.json)
      - run: npm ci
      - run: npx expo export --platform web
      # Landing (Vite + shadcn/ui), servida en /Dophamine/
      - run: npm ci && npm run build
        working-directory: web
      - name: Combinar landing y app
        run: |
          mkdir -p site
          cp -r web/dist/. site/
          cp -r dist site/app
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
