name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      ASSETS_TOKEN: ${{ secrets.DOPHAMINE_ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Contenido privado (RepDB y arte de Term) desde s7ex-j/dophamine-assets. Sin el secreto
      # (forks, PR de terceros) se salta y la app compila con los módulos vacíos.
      - name: Contenido privado
        if: env.ASSETS_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/s7ex-j/dophamine-assets.git" "$RUNNER_TEMP/privado"
          cp -r "$RUNNER_TEMP/privado/assets" "$RUNNER_TEMP/privado/src" .
          rm -rf "$RUNNER_TEMP/privado"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      ASSETS_TOKEN: ${{ secrets.DOPHAMINE_ASSETS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Contenido privado (RepDB y arte de Term) desde s7ex-j/dophamine-assets. Sin el secreto
      # (forks, PR de terceros) se salta y la app compila con los módulos vacíos.
      - name: Contenido privado
        if: env.ASSETS_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${ASSETS_TOKEN}@github.com/s7ex-j/dophamine-assets.git" "$RUNNER_TEMP/privado"
          cp -r "$RUNNER_TEMP/privado/assets" "$RUNNER_TEMP/privado/src" .
          rm -rf "$RUNNER_TEMP/privado"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exporta la web y recorre los flujos principales con el Chrome del runner.
      - run: npm run e2e

  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
